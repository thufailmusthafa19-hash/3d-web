<!DOCTYPE html>  <html lang="en">  
<head>  
    <meta name="google-site-verification" content="1bKMTmRadyCpHUC_yBQBkH6MN60go1v0pLeBKWOcfOM" />  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>K.M. TRADERS - Premium Luxury Food Store</title>  
    <style>  
        * {  
            margin: 0;  
            padding: 0;  
            box-sizing: border-box;  
        }  :root {  
        --dark-bg: #0f0f0f;  
        --dark-card: #1a1a1a;  
        --gold: #D4AF37;  
        --gold-light: #E8C547;  
        --text-light: #e0e0e0;  
        --text-gray: #999999;  
        --border-dark: #2a2a2a;  
    }  

    body {  
        font-family: 'Playfair Display', 'Georgia', serif;  
        background-color: var(--dark-bg);  
        color: var(--text-light);  
        line-height: 1.6;  
    }  

    /* Navigation */  
    nav {  
        background-color: var(--dark-bg);  
        padding: 1.5rem 2rem;  
        border-bottom: 1px solid var(--border-dark);  
        position: sticky;  
        top: 0;  
        z-index: 1000;  
    }  

    .nav-container {  
        max-width: 1400px;  
        margin: 0 auto;  
        display: flex;  
        justify-content: space-between;  
        align-items: center;  
    }  

    .nav-logo {  
        font-size: 1.8rem;  
        font-weight: 700;  
        letter-spacing: 3px;  
        color: var(--gold);  
        text-transform: uppercase;  
    }  

    .nav-menu {  
        display: flex;  
        gap: 3rem;  
        list-style: none;  
    }  

    .nav-menu a {  
        color: var(--text-light);  
        text-decoration: none;  
        font-size: 0.95rem;  
        transition: color 0.3s;  
        font-family: 'Segoe UI', sans-serif;  
        letter-spacing: 1px;  
    }  

    .nav-menu a:hover {  
        color: var(--gold);  
    }  

    .nav-icons {  
        display: flex;  
        gap: 1.5rem;  
        font-size: 1.3rem;  
    }  

    .nav-icons a {  
        color: var(--text-light);  
        text-decoration: none;  
        transition: color 0.3s;  
    }  

    .nav-icons a:hover {  
        color: var(--gold);  
    }  

    @media (max-width: 768px) {  
        .nav-menu {  
            display: none;  
        }  
        .nav-container {  
            justify-content: space-between;  
        }  
    }  

    /* Hero Section */  
    .hero {  
        background: linear-gradient(135deg, #2a2a2a 0%, #0f0f0f 100%);  
        padding: 5rem 2rem;  
        text-align: center;  
    }  

    .hero-container {  
        max-width: 1200px;  
        margin: 0 auto;  
    }  

    .hero-image {  
        width: 100%;  
        height: 400px;  
        background: linear-gradient(135deg, #3a3a2a 0%, #2a2a1a 100%);  
        border-radius: 8px;  
        margin-bottom: 3rem;  
    }  

    .hero h1 {  
        font-size: 4rem;  
        color: var(--gold);  
        margin-bottom: 1.5rem;  
        line-height: 1.2;  
        font-weight: 700;  
    }  

    .hero p {  
        font-size: 1.1rem;  
        color: var(--text-gray);  
        margin-bottom: 2rem;  
        font-family: 'Segoe UI', sans-serif;  
        max-width: 600px;  
        margin-left: auto;  
        margin-right: auto;  
    }  

    .hero-buttons {  
        display: flex;  
        gap: 2rem;  
        justify-content: center;  
        flex-wrap: wrap;  
        margin-bottom: 4rem;  
    }  

    .btn {  
        padding: 0.9rem 2rem;  
        border: none;  
        border-radius: 50px;  
        font-size: 0.95rem;  
        font-weight: 600;  
        cursor: pointer;  
        transition: all 0.3s;  
        text-decoration: none;  
        display: inline-block;  
        font-family: 'Segoe UI', sans-serif;  
        letter-spacing: 1px;  
        text-transform: uppercase;  
    }  

    .btn-primary {  
        background-color: var(--gold);  
        color: var(--dark-bg);  
    }  

    .btn-primary:hover {  
        background-color: var(--gold-light);  
        transform: translateY(-2px);  
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);  
    }  

    .btn-secondary {  
        background-color: transparent;  
        color: var(--gold);  
        border: 2px solid var(--gold);  
    }  

    .btn-secondary:hover {  
        background-color: var(--gold);  
        color: var(--dark-bg);  
    }  

    /* Stats Section */  
    .stats {  
        background-color: var(--dark-card);  
        padding: 3rem 2rem;  
        border-top: 1px solid var(--border-dark);  
        border-bottom: 1px solid var(--border-dark);  
    }  

    .stats-container {  
        max-width: 1200px;  
        margin: 0 auto;  
        display: grid;  
        grid-template-columns: repeat(4, 1fr);  
        gap: 2rem;  
        text-align: center;  
    }  

    .stat-item {  
        padding: 2rem;  
        border: 1px solid var(--border-dark);  
        border-radius: 8px;  
        background-color: rgba(212, 175, 55, 0.05);  
    }  

    .stat-number {  
        font-size: 2.5rem;  
        color: var(--gold);  
        font-weight: 700;  
        margin-bottom: 0.5rem;  
    }  

    .stat-label {  
        color: var(--text-gray);  
        font-size: 0.9rem;  
        letter-spacing: 2px;  
        text-transform: uppercase;  
        font-family: 'Segoe UI', sans-serif;  
    }  

    @media (max-width: 1024px) {  
        .stats-container {  
            grid-template-columns: repeat(2, 1fr);  
        }  
    }  

    @media (max-width: 768px) {  
        .stats-container {  
            grid-template-columns: 1fr;  
        }  
    }  

    /* Heritage Section */  
    .heritage {  
        padding: 5rem 2rem;  
        background-color: var(--dark-bg);  
    }  

    .heritage-container {  
        max-width: 1200px;  
        margin: 0 auto;  
        display: grid;  
        grid-template-columns: 1fr 1fr;  
        gap: 3rem;  
        align-items: center;  
    }  

    .heritage-content h2 {  
        font-size: 2.8rem;  
        color: var(--gold);  
        margin-bottom: 1.5rem;  
        line-height: 1.2;  
    }  

    .heritage-content p {  
        color: var(--text-gray);  
        margin-bottom: 1.5rem;  
        font-family: 'Segoe UI', sans-serif;  
        line-height: 1.8;  
    }  

    .heritage-features {  
        display: flex;  
        flex-direction: column;  
        gap: 1rem;  
    }  

    .feature-item {  
        display: flex;  
        gap: 1rem;  
        align-items: flex-start;  
    }  

    .feature-icon {  
        font-size: 1.5rem;  
        color: var(--gold);;  
    }  

    .feature-text {  
        color: var(--text-gray);  
        font-family: 'Segoe UI', sans-serif;  
    }  

    .heritage-image {  
        width: 100%;  
        height: 500px;  
        background: linear-gradient(135deg, #3a3a2a 0%, #2a2a1a 100%);  
        border-radius: 8px;  
    }  

    @media (max-width: 768px) {  
        .heritage-container {  
            grid-template-columns: 1fr;  
        }  
        .heritage-image {  
            height: 300px;  
        }  
    }  

    /* Collections Section */  
    .collections {  
        padding: 5rem 2rem;  
        background-color: var(--dark-card);  
    }  

    .collections-container {  
        max-width: 1400px;  
        margin: 0 auto;  
    }  

    .section-title {  
        text-align: center;  
        font-size: 3rem;  
        color: var(--gold);  
        margin-bottom: 3rem;  
        position: relative;  
        padding-bottom: 1.5rem;  
    }  

    .section-title:after {  
        content: '';  
        position: absolute;  
        bottom: 0;  
        left: 50%;  
        transform: translateX(-50%);  
        width: 80px;  
        height: 3px;  
        background-color: var(--gold);  
    }  

    .section-subtitle {  
        text-align: center;  
        color: var(--text-gray);  
        margin-bottom: 3rem;  
        font-family: 'Segoe UI', sans-serif;  
    }  

    .products-grid {  
        display: grid;  
        grid-template-columns: repeat(4, 1fr);  
        gap: 2rem;  
    }  

    .product-card {  
        background-color: var(--dark-bg);  
        border-radius: 8px;  
        overflow: hidden;  
        transition: all 0.3s;  
        border: 1px solid var(--border-dark);  
    }  

    .product-card:hover {  
        transform: translateY(-8px);  
        box-shadow: 0 12px 30px rgba(212, 175, 55, 0.2);  
    }  

    .product-image {  
        width: 100%;  
        height: 250px;  
        background: linear-gradient(135deg, #3a3a2a 0%, #2a2a1a 100%);  
        position: relative;  
    }  

    .product-badge {  
        position: absolute;  
        top: 15px;  
        left: 15px;  
        background-color: var(--gold);  
        color: var(--dark-bg);  
        padding: 0.4rem 0.8rem;  
        border-radius: 50px;  
        font-size: 0.75rem;  
        font-weight: 700;  
        text-transform: uppercase;  
        letter-spacing: 1px;  
    }  

    .product-content {  
        padding: 1.5rem;  
    }  

    .product-name {  
        font-size: 1.2rem;  
        color: var(--gold);  
        margin-bottom: 0.5rem;  
    }  

    .product-desc {  
        font-size: 0.9rem;  
        color: var(--text-gray);  
        margin-bottom: 1rem;  
        font-family: 'Segoe UI', sans-serif;  
        line-height: 1.5;  
    }  

    .product-footer {  
        display: flex;  
        justify-content: space-between;  
        align-items: center;  
        border-top: 1px solid var(--border-dark);  
        padding-top: 1rem;  
    }  

    .product-price {  
        font-size: 1.1rem;  
        color: var(--gold);  
        font-weight: 700;  
    }  

    .product-cart {  
        background-color: var(--gold);  
        color: var(--dark-bg);  
        width: 40px;  
        height: 40px;  
        border-radius: 50%;  
        display: flex;  
        align-items: center;  
        justify-content: center;  
        cursor: pointer;  
        transition: all 0.3s;  
        border: none;  
        font-size: 1.2rem;  
    }  

    .product-cart:hover {  
        transform: scale(1.1);  
    }  

    @media (max-width: 1024px) {  
        .products-grid {  
            grid-template-columns: repeat(2, 1fr);  
        }  
    }  

    @media (max-width: 768px) {  
        .products-grid {  
            grid-template-columns: 1fr;  
        }  
    }  

    /* Features Section */  
    .features-highlight {  
        padding: 5rem 2rem;  
        background-color: var(--dark-bg);  
    }  

    .features-container {  
        max-width: 1200px;  
        margin: 0 auto;  
    }  

    .features-grid {  
        display: grid;  
        grid-template-columns: repeat(3, 1fr);  
        gap: 3rem;  
        margin-top: 3rem;  
    }  

    .feature-card {  
        text-align: center;  
    }  

    .feature-card-icon {  
        width: 100px;  
        height: 100px;  
        background-color: rgba(212, 175, 55, 0.1);  
        border-radius: 12px;  
        display: flex;  
        align-items: center;  
        justify-content: center;  
        margin: 0 auto 1.5rem;  
        font-size: 2.5rem;  
        color: var(--gold);  
    }  

    .feature-card h3 {  
        font-size: 1.5rem;  
        color: var(--gold);  
        margin-bottom: 1rem;  
    }  

    .feature-card p {  
        color: var(--text-gray);  
        font-family: 'Segoe UI', sans-serif;  
        line-height: 1.7;  
    }  

    @media (max-width: 768px) {  
        .features-grid {  
            grid-template-columns: 1fr;  
        }  
    }  

    /* Testimonials Section */  
    .testimonials {  
        padding: 5rem 2rem;  
        background-color: var(--dark-card);  
    }  

    .testimonials-container {  
        max-width: 1200px;  
        margin: 0 auto;  
    }  

    .testimonials-grid {  
        display: grid;  
        grid-template-columns: repeat(3, 1fr);  
        gap: 2rem;  
        margin-top: 3rem;  
    }  

    .testimonial-card {  
        background-color: var(--dark-bg);  
        padding: 2rem;  
        border-radius: 8px;  
        border: 1px solid var(--border-dark);  
    }  

    .stars {  
        color: var(--gold);  
        margin-bottom: 1rem;  
        font-size: 1.1rem;  
        letter-spacing: 2px;  
    }  

    .testimonial-text {  
        color: var(--text-gray);  
        margin-bottom: 1.5rem;  
        font-style: italic;  
        font-family: 'Segoe UI', sans-serif;  
        line-height: 1.7;  
    }  

    .testimonial-author {  
        display: flex;  
        gap: 1rem;  
        align-items: center;  
    }  

    .author-avatar {  
        width: 50px;  
        height: 50px;  
        background: linear-gradient(135deg, var(--gold), #8b6914);  
        border-radius: 50%;  
    }  

    .author-info h4 {  
        color: var(--text-light);  
        margin-bottom: 0.2rem;  
    }  

    .author-info p {  
        color: var(--text-gray);  
        font-size: 0.85rem;  
        font-family: 'Segoe UI', sans-serif;  
        letter-spacing: 1px;  
        text-transform: uppercase;  
    }  

    @media (max-width: 768px) {  
        .testimonials-grid {  
            grid-template-columns: 1fr;  
        }  
    }  

    /* Contact Section */  
    .contact {  
        padding: 5rem 2rem;  
        background-color: var(--dark-bg);  
    }  

    .contact-container {  
        max-width: 1200px;  
        margin: 0 auto;  
        display: grid;  
        grid-template-columns: 1fr 1fr;  
        gap: 4rem;  
    }  

    .contact-content h2 {  
        font-size: 2.8rem;  
        color: var(--gold);  
        margin-bottom: 1.5rem;  
    }  

    .contact-text {  
        color: var(--text-gray);  
        margin-bottom: 2rem;  
        font-family: 'Segoe UI', sans-serif;  
        line-height: 1.8;  
    }  

    .contact-info {  
        display: flex;  
        flex-direction: column;  
        gap: 2rem;  
    }  

    .info-item {  
        display: flex;  
        gap: 1.5rem;  
        align-items: flex-start;  
    }  

    .info-icon {  
        font-size: 1.5rem;  
        color: var(--gold);  
        min-width: 30px;  
    }  

    .info-content h4 {  
        color: var(--text-light);  
        margin-bottom: 0.3rem;  
        font-family: 'Segoe UI', sans-serif;  
        font-weight: 600;  
    }  

    .info-content p {  
        color: var(--text-gray);  
        font-family: 'Segoe UI', sans-serif;  
    }  

    .info-content a {  
        color: var(--text-gray);  
        text-decoration: none;  
        transition: color 0.3s;  
    }  

    .info-content a:hover {  
        color: var(--gold);  
    }  

    /* Form */  
    .contact-form {  
        display: flex;  
        flex-direction: column;  
        gap: 1.5rem;  
    }  

    .form-group {  
        display: flex;  
        flex-direction: column;  
    }  

    .form-group label {  
        color: var(--text-light);  
        margin-bottom: 0.5rem;  
        font-family: 'Segoe UI', sans-serif;  
        font-size: 0.95rem;  
    }  

    .form-group input,  
    .form-group textarea {  
        background-color: transparent;  
        border: none;  
        border-bottom: 1px solid var(--border-dark);  
        color: var(--text-light);  
        padding: 0.8rem 0;  
        font-family: 'Segoe UI', sans-serif;  
        font-size: 1rem;  
        transition: border-color 0.3s;  
    }  

    .form-group input::placeholder,  
    .form-group textarea::placeholder {  
        color: var(--text-gray);  
    }  

    .form-group input:focus,  
    .form-group textarea:focus {  
        outline: none;  
        border-bottom-color: var(--gold);  
    }  

    .form-group textarea {  
        resize: vertical;  
        min-height: 80px;  
    }  

    .form-submit {  
        background-color: var(--gold);  
        color: var(--dark-bg);  
        padding: 1rem 2.5rem;  
        border: none;  
        border-radius: 50px;  
        font-size: 1rem;  
        font-weight: 700;  
        cursor: pointer;  
        text-transform: uppercase;  
        letter-spacing: 2px;  
        transition: all 0.3s;  
        font-family: 'Segoe UI', sans-serif;  
        align-self: flex-start;  
        margin-top: 1rem;  
    }  

    .form-submit:hover {  
        background-color: var(--gold-light);  
        transform: translateY(-2px);  
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);  
    }  

    .form-submit:disabled {  
        opacity: 0.6;  
        cursor: not-allowed;  
    }  

    .form-message {  
        padding: 1rem;  
        border-radius: 4px;  
        display: none;  
        margin-bottom: 1rem;  
        font-family: 'Segoe UI', sans-serif;  
    }  

    .form-message.success {  
        background-color: rgba(22, 163, 74, 0.2);  
        color: #4ade80;  
        border: 1px solid #4ade80;  
        display: block;  
    }  

    .form-message.error {  
        background-color: rgba(220, 38, 38, 0.2);  
        color: #f87171;  
        border: 1px solid #f87171;  
        display: block;  
    }  

    @media (max-width: 768px) {  
        .contact-container {  
            grid-template-columns: 1fr;  
        }  
    }  

    /* Footer */  
    footer {  
        background-color: var(--dark-card);  
        padding: 3rem 2rem 1rem;  
        border-top: 1px solid var(--border-dark);  
    }  

    .footer-container {  
        max-width: 1200px;  
        margin: 0 auto;  
        text-align: center;  
    }  

    .footer-logo {  
        font-size: 1.5rem;  
        color: var(--gold);  
        margin-bottom: 2rem;  
        letter-spacing: 2px;  
    }  

    .footer-links {  
        display: flex;  
        justify-content: center;  
        gap: 2.5rem;  
        margin-bottom: 2rem;  
        flex-wrap: wrap;  
    }  

    .footer-links a {  
        color: var(--text-gray);  
        text-decoration: none;  
        font-family: 'Segoe UI', sans-serif;  
        font-size: 0.9rem;  
        letter-spacing: 1px;  
        text-transform: uppercase;  
        transition: color 0.3s;  
    }  

    .footer-links a:hover {  
        color: var(--gold);  
    }  

    .footer-social {  
        display: flex;  
        justify-content: center;  
        gap: 1.5rem;  
        margin-bottom: 2rem;  
        font-size: 1.3rem;  
    }  

    .footer-social a {  
        color: var(--gold);  
        text-decoration: none;  
        transition: color 0.3s;  
    }  

    .footer-social a:hover {  
        color: var(--gold-light);  
    }  

    .footer-bottom {  
        border-top: 1px solid var(--border-dark);  
        padding-top: 2rem;  
        color: var(--text-gray);  
        font-family: 'Segoe UI', sans-serif;  
        font-size: 0.85rem;  
        letter-spacing: 1px;  
    }  

    /* Spinner */  
    .spinner {  
        display: inline-block;  
        width: 16px;  
        height: 16px;  
        border: 2px solid rgba(212, 175, 55, 0.3);  
        border-top: 2px solid var(--gold);  
        border-radius: 50%;  
        animation: spin 0.8s linear infinite;  
    }  

    @keyframes spin {  
        to { transform: rotate(360deg); }  
    }  

    @media (max-width: 768px) {  
        .hero h1 {  
            font-size: 2.2rem;  
        }  
        .section-title {  
            font-size: 2rem;  
        }  
    }  
</style>

</head>  
<body>  
    <!-- Navigation -->  
    <nav>  
        <div class="nav-container">  
            <div class="nav-logo">K.M. TRADERS</div>  
            <ul class="nav-menu">  
                <li><a href="#collections">Collections</a></li>  
                <li><a href="#heritage">Dates</a></li>  
                <li><a href="#collections">Nuts</a></li>  
                <li><a href="#features">Masalas</a></li>  
                <li><a href="#features">Gifts</a><
